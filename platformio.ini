[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_M5STACK_STICK_C_PLUS2
; PLUS2 stub: GIF character loader (character.cpp), transcript transfer
; (xfer.h), and stats/data (stats.h, data.h) remain parked until their
; phases land. BLE bridge revived in Phase A of claude-integration.
build_src_filter = +<main.cpp> +<buddy.cpp> +<buddies/> +<ble_bridge.cpp>
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7.0.0
